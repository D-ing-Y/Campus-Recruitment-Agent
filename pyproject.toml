[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-agent"
version = "0.7.0"
description = "Evidence-driven candidate, role and explainable matching Graphs for campus job intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.2,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "langchain-deepseek>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "mcp>=1.24,<2",
  "pydantic>=2.13,<3",
  "pypdf>=6.14,<7",
  "pdfplumber>=0.11,<1",
  "httpx",
  "browser-cookie3==0.20.1",
]

[project.scripts]
campus-agent = "campus_job_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campus_job_agent = ["storage/migrations/*.sql", "ontology/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-p", "no:langsmith_plugin", "-p", "no:anyio"]
